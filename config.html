<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winamp</title><style>body{margin:0;padding:0 0 90px;background:#0b0b12;color:#c9c9d6;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.bar{background:#000;padding:9px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;border-bottom:2px solid #aaaa55}.bolt{width:14px;height:18px;flex:none}.bar h1{margin:0;font-size:14px;letter-spacing:3px;color:#fff;font-weight:700}.grp{margin:14px 10px;background:#373757;border:1px solid #000;box-shadow:inset 1px 1px 0 #5c5c6b}.grp>h2{margin:0;padding:7px 12px;font-size:11px;letter-spacing:2px;color:#ecce7a;background:#25253a;text-transform:uppercase}.row{display:flex;gap:12px;align-items:flex-start;padding:12px;border-top:1px solid #2b2b45;cursor:pointer}.row:first-of-type{border-top:none}.row input{margin:2px 0 0;width:20px;height:20px;flex:none;accent-color:#00c000}.row b{display:block;font-weight:600;color:#e8e8f2;font-size:15px}.row i{display:block;font-style:normal;font-size:12.5px;color:#9a9ab0;margin-top:3px}.seg{display:flex;padding:10px 12px 14px;gap:6px}.seg button{flex:1;padding:11px 4px;font-size:13px;font-weight:600;background:#25253a;color:#c9c9d6;border:1px solid #000;box-shadow:inset 1px 1px 0 #5c5c6b;cursor:pointer;border-radius:0}.seg button.on{background:#00c000;color:#04210a;box-shadow:none}.hint{padding:0 12px 12px;font-size:12.5px;color:#9a9ab0}.save{position:fixed;left:0;right:0;bottom:0;padding:12px;background:#0b0b12;border-top:1px solid #2b2b45}.save button{width:100%;padding:15px;font-size:16px;font-weight:700;letter-spacing:1px;background:#aaaa55;color:#101018;border:0;cursor:pointer}</style></head><body><div class="bar"><svg class="bolt" viewBox="0 0 25 25"><path fill="#ecce7a" d="M21 0 L9 13 L14 13 L3 25 L17 11 L11 11 Z"/></svg><h1>WINAMP</h1></div><div class="grp"><h2>Display</h2><label class="row"><input type="checkbox" id="ghost" checked><span><b>Clock backlight</b><i>Shows the unlit segments behind the digits, like an idle LED panel. Turn off for bare digits on black.</i></span></label><label class="row"><input type="checkbox" id="vivid"><span><b>Washed-out colour fixer</b><i>Pushes the palette brighter than the Winamp skin to compensate for the reflective display. Off matches the skin more closely.</i></span></label></div><div class="grp"><h2>Seek bar</h2><div class="seg"><button data-seek="0">Never</button><button data-seek="1">Per minute</button><button data-seek="2" class="on">Per second</button></div><div class="hint">Per second sweeps the bar once a minute and shows seconds in the playlist readout, but wakes the watch 86,400 times a day instead of 1,440. Expect roughly half the battery life. Never parks the thumb at the left.</div></div><div class="grp"><h2>Motion</h2><label class="row"><input type="checkbox" id="colon" checked><span><b>Colon tick</b><i>Blinks the colon each second. Also forces the per-second wake, so turning this off with the seek bar on Never or Per minute is the gentlest setting on the battery.</i></span></label><label class="row"><input type="checkbox" id="shake" checked><span><b>Analyser on shake</b><i>A wrist flick runs the spectrum analyser for three seconds, then it settles. Off leaves it static and releases the accelerometer.</i></span></label></div><div class="grp"><h2>Pebble Time 2</h2><label class="row"><input type="checkbox" id="hr"><span><b>Heart rate &mdash; experimental</b><i>Replaces the 128 kbps figure with your current BPM. Needs a watch with a heart rate sensor; shows -- when there is no reading. The sensor is sampled only when the watchface redraws, so the number can lag.</i></span></label><label class="row"><input type="checkbox" id="hrviz"><span><b>Analyser shows heart rate &mdash; experimental</b><i>Turns the spectrum analyser into a rolling BPM history, one sample per second scrolling in from the right. Taller means faster, and the green-to-red colour ramp lands on heart rate zones. Covers about 18 seconds on a Pebble Time, 45 on a Time 2. Overrides the shake burst and forces the per-second wake.</i></span></label></div><div class="save"><button id="go">Save</button></div><script>var seek=2;try{var h=location.hash.slice(1);if(h){var c=JSON.parse(decodeURIComponent(h));var ids=["ghost","vivid","colon","shake","hr","hrviz"];for(var n=0;n<ids.length;n++){var el=document.getElementById(ids[n]);if(el&&c[ids[n]]!==undefined)el.checked=!!c[ids[n]];}if(c.seek!==undefined)seek=c.seek|0;}}catch(e){}var btns=document.querySelectorAll(".seg button");for(var i=0;i<btns.length;i++){btns[i].className=(parseInt(btns[i].getAttribute("data-seek"),10)===seek)?"on":"";btns[i].onclick=function(){for(var j=0;j<btns.length;j++)btns[j].className="";this.className="on";seek=parseInt(this.getAttribute("data-seek"),10);};}function v(id){return document.getElementById(id).checked?1:0;}function rt(){var m=location.search.match(/[?&]return_to=([^&]+)/);return m?decodeURIComponent(m[1]):"pebblejs://close#";}document.getElementById("go").onclick=function(){var out={ghost:v("ghost"),vivid:v("vivid"),seek:seek,colon:v("colon"),shake:v("shake"),hr:v("hr"),hrviz:v("hrviz")};location.href=rt()+encodeURIComponent(JSON.stringify(out));};</script></body></html>
